name: BioBes Pages

# Publikimi bëhet vetvetiu sa herë që main merr një ndryshim në aplikacionin web.
# Më parë kishte vetëm workflow_dispatch, ndaj faqja live mund të mbetej pas kodit
# pa u vënë re. Tani çdo merge në main e publikon menjëherë; workflow_dispatch
# mbetet për ripublikim manual.
on:
  push:
    branches: [main]
    paths:
      - 'BioBes_Paketa_e_Fundit_Kompjuter_Cloud/BioBes_Paketa_e_Fundit/BioBes_Cloud/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ocr
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BioBes_Paketa_e_Fundit_Kompjuter_Cloud/BioBes_Paketa_e_Fundit/BioBes_Cloud/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
