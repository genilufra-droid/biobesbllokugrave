<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<title>BioBes · Rivendos fjalëkalimin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f1;color:#1b2c3b;font:15px/1.5 system-ui,sans-serif;padding:24px}.card{width:min(100%,440px);background:#fff;border:1px solid #dce7dc;border-radius:20px;box-shadow:0 24px 70px #213e261f;padding:34px}.brand{font-weight:800;color:#1b683f;font-size:20px}h1{font-size:24px;line-height:1.2}p{color:#526458}label{font-weight:650;display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #b8c9bf;border-radius:9px}button{background:#1b683f;color:#fff;border:0;font-weight:700;margin-top:20px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.message{padding:12px;border-radius:9px;background:#f1f6f1;overflow-wrap:anywhere}a{color:#24613c}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #a2c1ae}[hidden]{display:none!important}
</style>
</head>
<body><main class="card"><div class="brand">BioBes</div><h1>Vendos fjalëkalimin e ri</h1>
<p id="status" class="message" role="status" aria-live="polite">Po kontrollohet lidhja e rikuperimit…</p>
<form id="reset-form" hidden><label for="password">Fjalëkalimi i ri</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Përsërite fjalëkalimin</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><p>Përdor të paktën 12 karaktere. Mos ia dërgo askujt fjalëkalimin.</p><button id="submit" type="submit">Ruaj fjalëkalimin</button></form>
<p><a href="./">Kthehu te hyrja në BioBes</a></p></main>
<script src="vendor/supabase.min.js"></script><script src="cloud-config.js"></script><script src="reset-password.js"></script></body></html>
